name: Windows test build

# For a fork: builds an unsigned Windows installer of this branch and keeps it as a download on the run's page
# (Actions → this run → Artifacts). No release is made and no signing keys are needed. Not for the main project:
# leave this file out of pull requests to it.
on:
  push:
    branches: [desktop-widgets]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: showcase/tauri
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: showcase/tauri/sidecar/package-lock.json

      - name: Install sidecar dependencies
        working-directory: showcase/tauri/sidecar
        run: npm ci

      - name: Test sidecar
        working-directory: showcase/tauri/sidecar
        run: npm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            showcase/tauri/src-tauri -> target
            showcase/tauri/src-tauri/voice-win -> target
            showcase/tauri/src-tauri/hands-win -> target
          key: fork-x86_64-pc-windows-msvc

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Update bundles need the main project's signing key, which a fork doesn't have: build the installer without them.
      - name: Build the installer
        env:
          TAURI_BUNDLES: nsis
        run: |
          printf '%s\n' '{ "bundle": { "createUpdaterArtifacts": false } }' > src-tauri/fork.conf.json
          ./build.sh release --target x86_64-pc-windows-msvc --config fork.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: Roamies-windows-test-build
          path: showcase/tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
